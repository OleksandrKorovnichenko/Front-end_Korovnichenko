<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Manager — інтерактивний список завдань з JSONPlaceholder API.">
    <meta name="author" content="Олександр Коровніченко">
    <title>Task Manager — Лабораторна 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="user-info" id="user-info" aria-live="polite"></div>
            <h1 class="app-title">Task Manager</h1>
            <p class="app-subtitle">Лабораторна 5</p>
            <p class="app-hint">Список завдань формується з JSONPlaceholder API.</p>
        </header>

        <div class="loader" id="loader" hidden aria-hidden="true">
            <span class="loader__spinner" aria-hidden="true"></span>
            <span class="loader__text">Завантаження…</span>
        </div>

        <div class="error-banner" id="error-banner" role="alert" hidden></div>

        <form class="task-form" id="task-form" novalidate>
            <label class="visually-hidden" for="task-input">Текст нового завдання</label>
            <input
                type="text"
                id="task-input"
                class="task-input"
                name="title"
                autocomplete="off"
                placeholder="Що потрібно зробити?"
                maxlength="200"
            >
            <button type="submit" class="btn btn--primary" id="add-btn" disabled>Додати</button>
        </form>

        <div class="toolbar">
            <label class="visually-hidden" for="search-input">Пошук завдань</label>
            <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Пошук за текстом…"
                autocomplete="off"
            >

            <div class="filters" role="group" aria-label="Фільтр за статусом">
                <button type="button" class="filter-btn is-active" data-filter="all">Всі</button>
                <button type="button" class="filter-btn" data-filter="active">Активні</button>
                <button type="button" class="filter-btn" data-filter="completed">Виконані</button>
            </div>

            <p class="task-counter" id="task-counter" aria-live="polite">Активних завдань: 0</p>
        </div>

        <ul class="task-list" id="task-list" aria-label="Список завдань"></ul>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
